name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # No torch: the suite below runs on CPU without it, and the graph
          # library degrades to numpy when torch is unavailable.
          pip install numpy scipy scikit-image sknw pytest

      - name: Graph representation tests
        run: |
          pytest tests/test_mech_graph.py tests/test_mech_complex.py \
                 tests/test_graph_tensors.py -q

      - name: Quickstart example
        run: python examples/quickstart.py

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[graph,viz,dev]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Full CPU test suite
        run: pytest tests/ -q
